<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroHealth — Personalized Weather & Health Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-script: 'Caveat', cursive, serif;

      --bg-main: #f1f5f9;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-card: rgba(0, 0, 0, 0.06);
      --border-subtle: #e2e8f0;

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --risk-low: #10b981;
      --risk-low-bg: #ecfdf5;
      --risk-low-border: #a7f3d0;
      --risk-low-text: #065f46;

      --risk-mod: #f59e0b;
      --risk-mod-bg: #fffbeb;
      --risk-mod-border: #fde68a;
      --risk-mod-text: #92400e;

      --risk-high: #f97316;
      --risk-high-bg: #fff7ed;
      --risk-high-border: #fed7aa;
      --risk-high-text: #9a3412;

      --risk-severe: #ef4444;
      --risk-severe-bg: #fef2f2;
      --risk-severe-border: #fecaca;
      --risk-severe-text: #991b1b;

      --accent-blue: #0284c7;
      --accent-blue-subtle: #e0f2fe;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-subtle: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 16px -4px rgba(15, 23, 42, 0.04);
      --shadow-elevated: 0 12px 32px -8px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      letter-spacing: -0.022em;
      color: var(--text-primary);
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; transition: 0.15s ease; }
    input, select, textarea { font-family: inherit; color: inherit; }

    .premium-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .app-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-weather-card {
      position: relative;
      background:
        radial-gradient(ellipse 60% 80% at 85% 0%, rgba(255, 255, 255, 0.75) 0%, transparent 60%),
        linear-gradient(160deg, #e0f2fe 0%, #ecfdf5 55%, #fef3c7 100%);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: var(--radius-xl);
      padding: 28px 32px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .hero-weather-card::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 60%;
      background: radial-gradient(ellipse at center bottom, rgba(186, 230, 253, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .tab-nav-btn {
      padding: 6px 16px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-full);
      transition: 0.15s ease;
      border: 1px solid transparent;
    }
    .tab-nav-btn:hover { color: var(--text-primary); background: rgba(15, 23, 42, 0.04); }
    .tab-nav-btn.active {
      color: #ffffff;
      background: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-behavior: smooth;
    }
    .horizontal-scroll::-webkit-scrollbar { height: 4px; }
    .horizontal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .interactive-hour-pill {
      min-width: 82px;
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .interactive-hour-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .activity-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justifyContent: space-between;
      transition: all 0.2s ease;
    }
    .activity-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 6px 20px -4px rgba(15, 23, 42, 0.08);
      transform: translateY(-2px);
    }

    .vital-tile {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .action-chip:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = window.location.origin;

    function App() {
      const [authToken, setAuthToken] = useState(localStorage.getItem('aero_auth_token') || '');
      const [activePersonaId, setActivePersonaId] = useState('persona-1');
      const [activeTab, setActiveTab] = useState('home');
      const [data, setData] = useState(null);
      const [history, setHistory] = useState(null);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState('');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isForcedFallback, setIsForcedFallback] = useState(false);
      const [nowEpoch, setNowEpoch] = useState(Date.now() / 1000);

      // AI Copilot state
      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [aiChatInput, setAiChatInput] = useState('');
      const [aiChatMessages, setAiChatMessages] = useState([
        {
          sender: 'ai',
          text: "Hello! I am your AeroHealth AI Copilot. Ask me anything about outdoor running safety, N95 masks, optimal walking hours, or symptom prevention under today's atmospheric conditions.",
          engine: 'AI-generated (Qwen2.5-72B)'
        }
      ]);
      const [aiChatLoading, setAiChatLoading] = useState(false);

      // Email Alert modal state
      const [isSendAlertModalOpen, setIsSendAlertModalOpen] = useState(false);
      const [emailSubject, setEmailSubject] = useState('');
      const [emailBody, setEmailBody] = useState('');
      const [targetEmail, setTargetEmail] = useState('');
      const [isSendingEmail, setIsSendingEmail] = useState(false);
      const [emailSendFeedback, setEmailSendFeedback] = useState('');

      // Backwards-compatible aliases for legacy modal references
      const isSendSmsModalOpen = isSendAlertModalOpen;
      const setIsSendSmsModalOpen = setIsSendAlertModalOpen;
      const smsDraftText = emailBody;
      const setSmsDraftText = setEmailBody;
      const smsTargetPhone = targetEmail;
      const setSmsTargetPhone = setTargetEmail;
      const isSendingSms = isSendingEmail;
      const smsSendFeedback = emailSendFeedback;

      // Interactive Hourly Scrubber
      const [selectedHourIndex, setSelectedHourIndex] = useState(0);

      // Email Verification and GPS state in profile
      const [emailInput, setEmailInput] = useState('');
      const [emailOtpInput, setEmailOtpInput] = useState('');
      const [emailOtpSent, setEmailOtpSent] = useState(false);
      const [emailOtpCode, setEmailOtpCode] = useState('');
      const [phoneInput, setPhoneInput] = useState('');
      const [otpFeedback, setOtpFeedback] = useState('');
      const [isDetectingGps, setIsDetectingGps] = useState(false);

      const [simAqi, setSimAqi] = useState(140);
      const [simTemp, setSimTemp] = useState(33);
      const [simResult, setSimResult] = useState(null);
      const [simLoading, setSimLoading] = useState(false);
      const [trendMetric, setTrendMetric] = useState('risk');
      const [isDispatchingAlert, setIsDispatchingAlert] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => setNowEpoch(Date.now() / 1000), 1000);
        return () => clearInterval(timer);
      }, []);

      const formatFreshness = (isoStr) => {
        if (!isoStr) return 'just now';
        const fetchedSec = new Date(isoStr).getTime() / 1000;
        const diff = Math.max(0, Math.floor(nowEpoch - fetchedSec));
        if (diff < 4) return 'just now';
        if (diff < 60) return `${diff}s ago`;
        return `${Math.floor(diff / 60)}m ago`;
      };

      const showNotice = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      const loadData = async (token = authToken, forceFall = isForcedFallback) => {
        try {
          const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
          const [dRes, hRes] = await Promise.all([
            fetch(`${API_BASE}/api/dashboard?force_fallback=${forceFall ? 1 : 0}`, { headers }).then(r => r.json()),
            fetch(`${API_BASE}/api/history?days=7`, { headers }).then(r => r.json()).catch(() => null),
          ]);
          setData(dRes);
          setHistory(hRes);
          if (dRes?.profile?.email || dRes?.user?.email) {
            setEmailInput(dRes.profile?.email || dRes.user?.email || '');
            setTargetEmail(dRes.profile?.email || dRes.user?.email || '');
          }
          if (dRes?.profile?.phone) {
            setPhoneInput(dRes.profile.phone.replace(/^\+91/, ''));
          }

          // If location is default or missing, auto-detect via IP immediately
          const currentLabel = dRes?.location?.label || '';
          if (!currentLabel || currentLabel === 'New Delhi, Delhi' || currentLabel === 'Current Location') {
            fetch(`${API_BASE}/api/geocode/auto`)
              .then(r => r.json())
              .then(async (auto) => {
                if (auto?.lat && auto?.lon) {
                  if (token) {
                    await fetch(`${API_BASE}/api/location`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                      body: JSON.stringify(auto)
                    });
                  }
                  const updatedDash = await fetch(`${API_BASE}/api/dashboard?lat=${auto.lat}&lon=${auto.lon}&label=${encodeURIComponent(auto.label)}`, { headers }).then(r => r.json());
                  setData(updatedDash);
                }
              })
              .catch(() => {});
          }
        } catch (e) {
          showNotice('Connection error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const tok = urlParams.get('token');
        if (tok) {
          localStorage.setItem('aero_auth_token', tok);
          setAuthToken(tok);
          window.history.replaceState({}, document.title, window.location.pathname);
          showNotice(`Welcome ${urlParams.get('name') || 'User'}`);
          loadData(tok);
        } else if (authToken) {
          loadData(authToken);
        } else {
          // Unauthenticated: fetch preview for Landing Page with auto location
          fetch(`${API_BASE}/api/geocode/auto`)
            .then(r => r.json())
            .then(auto => {
              fetch(`${API_BASE}/api/dashboard?lat=${auto.lat}&lon=${auto.lon}&label=${encodeURIComponent(auto.label)}`)
                .then(r => r.json())
                .then(setData)
                .catch(() => loadData(''));
            })
            .catch(() => loadData(''));
        }
      }, []);

      const handleSignOut = () => {
        localStorage.removeItem('aero_auth_token');
        setAuthToken('');
        setData(null);
        showNotice('Signed out');
        loadData('');
      };

      const handleDetectGps = () => {
        setIsDetectingGps(true);
        setOtpFeedback('Detecting precise location…');
        const fallbackAuto = async () => {
          try {
            const auto = await fetch(`${API_BASE}/api/geocode/auto`).then(r => r.json());
            if (auto?.label) {
              if (authToken) {
                await fetch(`${API_BASE}/api/location`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                  body: JSON.stringify(auto)
                });
              }
              setOtpFeedback(`📍 Auto-detected: ${auto.label}`);
              loadData(authToken);
            }
          } catch (e) {
            setOtpFeedback('Location detection failed');
          } finally {
            setIsDetectingGps(false);
          }
        };

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              try {
                const { latitude, longitude } = pos.coords;
                const geo = await fetch(`${API_BASE}/api/geocode/reverse?lat=${latitude}&lon=${longitude}`).then(r => r.json());
                if (authToken) {
                  await fetch(`${API_BASE}/api/location`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({
                      lat: latitude,
                      lon: longitude,
                      label: geo.label,
                      city: geo.city,
                      country: geo.country
                    })
                  });
                }
                setOtpFeedback(`📍 GPS detected: ${geo.label}`);
                loadData(authToken);
              } catch (e) {
                await fallbackAuto();
              } finally {
                setIsDetectingGps(false);
              }
            },
            async () => {
              await fallbackAuto();
            },
            { timeout: 5000 }
          );
        } else {
          fallbackAuto();
        }
      };

      const handleSendEmailOtp = async () => {
        const target = (emailInput || data?.profile?.email || data?.user?.email || '').trim();
        if (!target || !target.includes('@')) {
          setOtpFeedback('Please enter a valid email address');
          return;
        }
        setOtpFeedback('Dispatching verification code via Gmail SMTP…');
        try {
          const authHdr = authToken ? { 'Authorization': `Bearer ${authToken}` } : { 'Authorization': `Bearer token-${activePersonaId}` };
          const res = await fetch(`${API_BASE}/api/email/send-otp`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHdr },
            body: JSON.stringify({ email: target })
          }).then(r => r.json());
          if (res.success) {
            setEmailOtpSent(true);
            if (res.otp) {
              setEmailOtpCode(res.otp);
            }
            setOtpFeedback(`✓ Verification code sent to ${target}`);
          } else {
            setOtpFeedback(res.error || 'Failed to dispatch email code');
          }
        } catch (e) {
          setOtpFeedback('Failed to dispatch verification code');
        }
      };

      const handleVerifyEmailOtp = async () => {
        if (!emailOtpInput || emailOtpInput.trim().length < 4) {
          setOtpFeedback('Enter 6-digit verification code');
          return;
        }
        try {
          const authHdr = authToken ? { 'Authorization': `Bearer ${authToken}` } : { 'Authorization': `Bearer token-${activePersonaId}` };
          const target = (emailInput || data?.profile?.email || data?.user?.email || '').trim();
          const res = await fetch(`${API_BASE}/api/email/verify-otp`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHdr },
            body: JSON.stringify({ email: target, otp: emailOtpInput.trim() })
          }).then(r => r.json());
          if (res.success) {
            setEmailOtpSent(false);
            setEmailOtpCode('');
            setOtpFeedback('✅ Email verified! Real-time alerts activated.');
            loadData(authToken);
          } else {
            setOtpFeedback(res.error || 'Incorrect verification code');
          }
        } catch (e) {
          setOtpFeedback('Verification error');
        }
      };

      const handleSendOtp = handleSendEmailOtp;
      const handleVerifyOtp = handleVerifyEmailOtp;

      const handleSelectPersona = async (pId) => {
        setActivePersonaId(pId);
        setLoading(true);
        try {
          const login = await fetch(`${API_BASE}/auth/demo-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ persona_id: pId })
          }).then(r => r.json());
          await loadData(login.access_token);
          showNotice(`Switched to ${login.user.name}`);
        } catch (e) {
          showNotice('Persona switch failed');
          setLoading(false);
        }
      };

      const handleToggleFallback = async () => {
        const next = !isForcedFallback;
        setIsForcedFallback(next);
        setLoading(true);
        await loadData(authToken || `token-${activePersonaId}`, next);
        showNotice(next ? 'Fallback active' : 'Live feeds restored');
      };

      // AI Copilot Query Function
      const handleAskAi = async (customPrompt) => {
        const query = customPrompt || aiChatInput;
        if (!query || !query.trim()) return;

        const userMsg = { sender: 'user', text: query.trim() };
        setAiChatMessages(prev => [...prev, userMsg]);
        if (!customPrompt) setAiChatInput('');
        setAiChatLoading(true);

        try {
          const authHdr = authToken ? { 'Authorization': `Bearer ${authToken}` } : { 'Authorization': `Bearer token-${activePersonaId}` };
          const res = await fetch(`${API_BASE}/api/ai-chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHdr },
            body: JSON.stringify({ question: query.trim() })
          }).then(r => r.json());

          setAiChatMessages(prev => [
            ...prev,
            {
              sender: 'ai',
              text: res.answer || "Analyzed current atmospheric vitals and personal profile. Routine caution advised.",
              engine: res.engine_mode || 'AI Health Copilot',
              latency: res.latency_ms
            }
          ]);
        } catch (err) {
          setAiChatMessages(prev => [
            ...prev,
            {
              sender: 'ai',
              text: "At current AQI levels, limit high-intensity outdoor workouts and favor indoor training.",
              engine: 'Clinical Fallback'
            }
          ]);
        } finally {
          setAiChatLoading(false);
        }
      };

      // Open Email Alert Dispatch Modal & Pre-fetch AI draft
      const handleOpenSendEmailModal = async () => {
        setIsSendAlertModalOpen(true);
        setEmailSendFeedback('');
        const userEmail = (emailInput || data?.profile?.email || data?.user?.email || 'tornovdutta@gmail.com').trim();
        setTargetEmail(userEmail);

        try {
          const authHdr = authToken ? { 'Authorization': `Bearer ${authToken}` } : { 'Authorization': `Bearer token-${activePersonaId}` };
          const res = await fetch(`${API_BASE}/api/advisory/draft-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHdr },
            body: JSON.stringify({})
          }).then(r => r.json());
          if (res?.subject) {
            setEmailSubject(res.subject);
          }
          if (res?.body) {
            setEmailBody(res.body);
          }
          if (res?.target_email) {
            setTargetEmail(res.target_email);
          }
        } catch (e) {
          const riskLv = data?.risk?.risk_level?.toUpperCase() || 'MODERATE';
          const locName = data?.location?.label?.split(',')[0] || 'your area';
          setEmailSubject(`⚠️ [AeroHealth Advisory] ${riskLv} Risk Alert: ${locName}`);
          setEmailBody(`Dear AeroHealth Member,\n\nAir quality in ${locName} is recorded at AQI ${data?.aqi?.aqi || 85}. Given your registered health profile, please avoid strenuous outdoor exertion during afternoon hours and carry recommended protective gear.\n\nOptimal outdoor window: after 6:30 PM.`);
        }
      };

      // Send Custom Email to recipient via Gmail SMTP TLS
      const handleSendCustomEmail = async () => {
        const dest = (targetEmail || '').trim();
        if (!dest || !dest.includes('@')) {
          setEmailSendFeedback('⚠️ Please enter a valid recipient email address.');
          return;
        }
        setIsSendingEmail(true);
        setEmailSendFeedback('Dispatching personalized advisory via Gmail SMTP TLS…');
        try {
          const authHdr = authToken ? { 'Authorization': `Bearer ${authToken}` } : { 'Authorization': `Bearer token-${activePersonaId}` };
          const res = await fetch(`${API_BASE}/api/notifications/send-custom-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHdr },
            body: JSON.stringify({
              email: dest,
              subject: emailSubject,
              message: emailBody
            })
          }).then(r => r.json());

          if (res.success) {
            setEmailSendFeedback(`✅ Email delivered to ${dest} via Gmail SMTP!`);
            showNotice(`Health advisory email dispatched to ${dest}`);
            loadData(authToken);
          } else {
            setEmailSendFeedback(`⚠️ Delivery notice: ${res.dispatch?.message || 'Check email configuration.'}`);
          }
        } catch (e) {
          setEmailSendFeedback('⚠️ Failed to dispatch email alert.');
        } finally {
          setIsSendingEmail(false);
        }
      };

      const handleOpenSendSmsModal = handleOpenSendEmailModal;
      const handleSendCustomSmsToPhone = handleSendCustomEmail;

      // Native Browser Push Notification
      const handleSendBrowserPushNotification = () => {
        if (!('Notification' in window)) {
          showNotice('Browser push notifications not supported.');
          return;
        }

        const fireNotice = () => {
          const title = `AeroHealth [${data?.risk?.risk_level?.toUpperCase() || 'MODERATE'}] Advisory`;
          const options = {
            body: smsDraftText || `${data?.advisory?.headline || 'Environmental Notice'}: AQI ${data?.aqi?.aqi} in ${data?.location?.label?.split(',')[0] || 'Current Area'}.`,
            icon: 'https://api.dicebear.com/7.x/shapes/svg?seed=AeroHealth'
          };
          try {
            new Notification(title, options);
            showNotice('🔔 System notification triggered on your screen!');
          } catch (e) {
            showNotice('Notification display failed');
          }
        };

        if (Notification.permission === 'granted') {
          fireNotice();
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(perm => {
            if (perm === 'granted') fireNotice();
            else showNotice('Notification permission was dismissed');
          });
        } else {
          showNotice('Notification permission is blocked in your browser settings.');
        }
      };

      const handleDispatchCustomAlert = async () => {

                </div>

                {/* Synthesized Email Advisory Body */}
                <div style={{ background: '#f8fafc', padding: '14px', borderRadius: '16px', border: '1px solid #e2e8f0', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                    <span style={{ fontSize: '0.74rem', fontWeight: 700, color: '#334155' }}>Synthesized Clinical Advisory Message</span>
                    <span style={{ fontSize: '0.68rem', color: '#64748b' }}>{emailBody.length} characters</span>
                  </div>
                  <textarea
                    rows={5}
                    value={emailBody}
                    onChange={(e) => setEmailBody(e.target.value)}
                    style={{
                      width: '100%', padding: '10px 12px', borderRadius: '12px',
                      border: '1px solid #cbd5e1', fontSize: '0.82rem', lineHeight: '1.45',
                      fontFamily: 'inherit', resize: 'vertical', outline: 'none'
                    }}
                  />
                  <div style={{ fontSize: '0.68rem', color: '#0284c7', marginTop: '4px', fontWeight: 600 }}>
                    ✨ Personalized by AI based on: {profile.conditions?.[0]?.replace('_', ' ') || 'Respiratory health'} · AQI {currentAqi} · {loc.label || 'Current Location'}.
                  </div>
                </div>

                {emailSendFeedback && (
                  <div style={{
                    padding: '10px 12px', borderRadius: '10px', marginBottom: '14px',
                    fontSize: '0.76rem', fontWeight: 600,
                    background: emailSendFeedback.includes('✅') ? '#ecfdf5' : '#fffbeb',
                    color: emailSendFeedback.includes('✅') ? '#065f46' : '#92400e',
                    border: `1px solid ${emailSendFeedback.includes('✅') ? '#a7f3d0' : '#fde68a'}`
                  }}>
                    {emailSendFeedback}
                  </div>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: '10px' }}>
                  <button
                    onClick={handleSendCustomEmail}
                    disabled={isSendingEmail}
                    style={{
                      padding: '12px', borderRadius: '12px',
                      background: '#0284c7', color: '#ffffff',
                      fontSize: '0.82rem', fontWeight: 700, border: 'none',
                      cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px'
                    }}
                  >
                    <span>📨</span>
                    <span>{isSendingEmail ? 'Sending via Gmail…' : 'Send via Gmail SMTP'}</span>
                  </button>

                  <button
                    onClick={handleSendBrowserPushNotification}
                    style={{
                      padding: '12px', borderRadius: '12px',
                      background: '#0f172a', color: '#ffffff',
                      fontSize: '0.82rem', fontWeight: 700, border: 'none',
                      cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px'
                    }}
                  >
                    <span>🔔</span>
                    <span>Trigger Push Alert</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Drawer for Notifications */}
          {isDrawerOpen && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(15,23,42,0.35)', backdropFilter: 'blur(6px)', zIndex: 1000, display: 'flex', justifyContent: 'flex-end', animation: 'fadeIn 0.2s ease-out' }} onClick={() => setIsDrawerOpen(false)}>
              <div style={{ width: '420px', maxWidth: '92vw', height: '100%', background: '#ffffff', borderLeft: '1px solid #e2e8f0', padding: '20px', display: 'flex', flexDirection: 'column', gap: '14px', boxShadow: 'var(--shadow-elevated)' }} onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span style={{ fontSize: '1.1rem' }}>🔔</span>
                    <div style={{ fontWeight: 700, fontSize: '1rem', color: '#0f172a' }}>Notifications & Alerts</div>
                    {alertsList.length > 0 && (
                      <span style={{ padding: '2px 8px', background: '#fef2f2', color: '#ef4444', border: '1px solid #fecaca', borderRadius: '999px', fontSize: '0.72rem', fontWeight: 700 }}>
                        {alertsList.length}
                      </span>
                    )}
                  </div>
                  <button onClick={() => setIsDrawerOpen(false)} style={{ fontSize: '1rem', color: '#64748b', background: '#f1f5f9', width: '28px', height: '28px', borderRadius: '50%', cursor: 'pointer' }}>×</button>
                </div>

                <button
                  onClick={() => { setActiveTab('alerts'); setIsDrawerOpen(false); }}
                  style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    padding: '10px 14px', background: '#f1f5f9', borderRadius: '12px',
                    border: '1px solid #e2e8f0', color: '#0f172a', fontWeight: 600, fontSize: '0.82rem',
                    cursor: 'pointer'
                  }}
                >
                  <span>Open Full Alerts Timeline</span>
                  <span>→</span>
                </button>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  <button
                    onClick={handleSendTestEmail}
                    style={{ padding: '9px 10px', background: '#059669', color: '#ffffff', borderRadius: '10px', fontWeight: 600, fontSize: '0.74rem', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px' }}
                  >
                    <span>📨</span>
                    <span>Test Email</span>
                  </button>
                  <button
                    onClick={handleTriggerScheduler}
                    style={{ padding: '9px 10px', background: '#0f172a', color: '#ffffff', borderRadius: '10px', fontWeight: 600, fontSize: '0.74rem', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px' }}
                  >
                    <span>⏱</span>
                    <span>Check Poll</span>
                  </button>
                </div>

                <div style={{ overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '10px', flex: 1, paddingRight: '4px' }}>
                  <div style={{ fontSize: '0.7rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#64748b', marginTop: '4px' }}>
                    Recent Timeline
                  </div>
                  {alertsList.length === 0 ? (
                    <div style={{ padding: '24px 14px', textAlign: 'center', color: '#94a3b8', fontSize: '0.82rem', background: '#f8fafc', borderRadius: '12px', border: '1px dashed #cbd5e1' }}>
                      No active alerts today
                    </div>
                  ) : (
                    alertsList.map((item, ii) => (
                      <div key={ii} style={{ background: '#ffffff', padding: '12px 14px', borderRadius: '12px', border: '1px solid #e2e8f0', boxShadow: '0 1px 3px rgba(0,0,0,0.03)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                          <span style={{ fontSize: '0.64rem', fontWeight: 700, textTransform: 'uppercase', padding: '2px 7px', borderRadius: '999px', background: '#fffbeb', color: '#d97706', border: '1px solid #fde68a' }}>
                            {item.risk_level || 'Alert'}
                          </span>
                          <span style={{ fontSize: '0.68rem', color: '#94a3b8' }}>{item.timestamp || 'Recent'}</span>
                        </div>
                        <div style={{ fontWeight: 600, fontSize: '0.84rem', color: '#0f172a', marginBottom: '4px', lineHeight: 1.3 }}>
                          {item.headline || item.subject || 'Environmental Health Notice'}
                        </div>
                        <div style={{ fontSize: '0.74rem', color: '#475569', lineHeight: 1.4 }}>
                          {item.advisory_text || item.custom_alert_message || ''}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Profile Modal */}
          {isProfileModalOpen && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(15,23,42,0.45)', backdropFilter: 'blur(8px)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setIsProfileModalOpen(false)}>
              <div style={{ width: '500px', maxWidth: '92vw', maxHeight: '90vh', overflowY: 'auto', background: '#ffffff', borderRadius: '24px', padding: '24px', border: '1px solid #e2e8f0', boxShadow: 'var(--shadow-elevated)' }} onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                  <div style={{ fontWeight: 700, fontSize: '1.1rem', color: '#0f172a' }}>Your Health Profile</div>
                  <button onClick={() => setIsProfileModalOpen(false)} style={{ fontSize: '1rem', color: '#64748b', background: '#f1f5f9', width: '28px', height: '28px', borderRadius: '50%', border: 'none', cursor: 'pointer' }}>×</button>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px', padding: '12px 14px', background: '#f8fafc', borderRadius: '14px', border: '1px solid #e2e8f0', flexWrap: 'wrap', gap: '8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <img src={user.picture || 'https://api.dicebear.com/7.x/avataaars/svg?seed=User'} style={{ width: '42px', height: '42px', borderRadius: '50%' }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, color: '#0f172a', fontSize: '0.92rem' }}>{user.name || 'User'}</div>
                      <div style={{ fontSize: '0.74rem', color: '#64748b' }}>{user.email || 'AeroHealth Account'}</div>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setIsProfileModalOpen(false);
                      handleSignOut();
                    }}
                    style={{
                      padding: '5px 14px', borderRadius: '999px',
                      background: '#fff7ed', color: '#c2410c',
                      border: '1px solid #fed7aa', fontSize: '0.74rem', fontWeight: 600, cursor: 'pointer'
                    }}
                  >
                    Sign Out
                  </button>
                </div>

                {/* GPS Location Sync */}
                <div style={{ background: '#f8fafc', padding: '12px 14px', borderRadius: '12px', border: '1px solid #e2e8f0', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                    <span style={{ fontSize: '0.78rem', fontWeight: 700, color: '#0f172a' }}>Monitored Location</span>
                    <button
                      type="button"
                      onClick={handleDetectGps}
                      disabled={isDetectingGps}
                      style={{
                        padding: '4px 10px', borderRadius: '999px', background: '#ffffff',
                        border: '1px solid #cbd5e1', fontSize: '0.72rem', fontWeight: 600,
                        cursor: 'pointer'
                      }}
                    >
                      {isDetectingGps ? 'Locating…' : '📍 Auto-detect Location'}
                    </button>
                  </div>
                  <div style={{ fontSize: '0.82rem', color: '#334155' }}>{loc.label || 'Default Location'}</div>
                </div>

                {/* Email Address Verification (Gmail Gateway) */}
                <div style={{ background: '#f8fafc', padding: '14px', borderRadius: '14px', border: '1px solid #e2e8f0', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <span style={{ fontSize: '0.9rem' }}>📧</span>
                      <span style={{ fontSize: '0.78rem', fontWeight: 700, color: '#0f172a' }}>Email Address Verification</span>
                    </div>
                    <span style={{ fontSize: '0.68rem', fontWeight: 700, padding: '2px 8px', borderRadius: '999px', background: profile.email_verified ? '#ecfdf5' : '#fffbeb', color: profile.email_verified ? '#059669' : '#b45309', border: `1px solid ${profile.email_verified ? '#a7f3d0' : '#fde68a'}` }}>
                      {profile.email_verified ? '✓ Verified Active' : '⚠️ Action Required'}
                    </span>
                  </div>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <input
                      type="email"
                      placeholder="Enter email address"
                      value={emailInput}
                      onChange={(e) => setEmailInput(e.target.value)}
                      style={{ flex: 1, padding: '8px 10px', borderRadius: '8px', border: '1px solid #cbd5e1', fontSize: '0.82rem' }}
                    />
                    {!profile.email_verified && (
                      <button
                        type="button"
                        onClick={handleSendEmailOtp}
                        style={{ padding: '8px 14px', borderRadius: '8px', background: '#0284c7', color: '#fff', fontSize: '0.74rem', fontWeight: 600, border: 'none', cursor: 'pointer' }}
                      >
                        {emailOtpSent ? 'Resend' : 'Send Code'}
                      </button>
                    )}
                  </div>

                  {emailOtpSent && !profile.email_verified && (
                    <div>
                      {emailOtpCode && (
                        <div style={{ background: '#f0fdf4', border: '1px solid #86efac', borderRadius: '12px', padding: '10px 12px', marginTop: '10px', marginBottom: '8px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: '0.7rem', fontWeight: 700, color: '#166534', textTransform: 'uppercase' }}>Security Verification Code</span>
                            <button
                              type="button"
                              onClick={() => setEmailOtpInput(emailOtpCode)}
                              style={{ padding: '3px 8px', borderRadius: '999px', background: '#15803d', color: '#fff', fontSize: '0.7rem', fontWeight: 600, border: 'none', cursor: 'pointer' }}
                            >
                              Autofill Code
                            </button>
                          </div>
                          <div style={{ fontSize: '1.4rem', fontWeight: 800, color: '#166534', letterSpacing: '0.15em', margin: '3px 0' }}>{emailOtpCode}</div>
                          <div style={{ fontSize: '0.68rem', color: '#15803d' }}>Dispatched via Gmail SMTP TLS to <strong>{emailInput || user.email}</strong>.</div>
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: '8px', marginTop: '6px' }}>
                        <input
                          type="text"
                          placeholder="6-digit code"
                          maxLength={6}
                          value={emailOtpInput}
                          onChange={(e) => setEmailOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                          style={{ flex: 1, padding: '8px 10px', borderRadius: '8px', border: '1.5px solid #0284c7', fontSize: '0.85rem', fontWeight: 700 }}
                        />
                        <button
                          type="button"
                          onClick={handleVerifyEmailOtp}
                          style={{ padding: '8px 16px', borderRadius: '8px', background: '#0284c7', color: '#fff', fontSize: '0.76rem', fontWeight: 600, border: 'none', cursor: 'pointer' }}
                        >
                          Verify Code
                        </button>
                      </div>
                    </div>
                  )}

                  {otpFeedback && (
                    <div style={{ marginTop: '8px', fontSize: '0.74rem', color: otpFeedback.includes('✓') || otpFeedback.includes('✅') || otpFeedback.includes('📍') ? '#059669' : '#dc2626', fontWeight: 500 }}>
                      {otpFeedback}
                    </div>
                  )}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', fontSize: '0.82rem', marginBottom: '14px' }}>
                  <div><div style={{ fontWeight: 600, color: '#334155', marginBottom: '4px' }}>Age</div><div style={{ padding: '8px', background: '#f1f5f9', borderRadius: '8px' }}>{profile.age_group || '18-40'}</div></div>
                  <div><div style={{ fontWeight: 600, color: '#334155', marginBottom: '4px' }}>Occupation</div><div style={{ padding: '8px', background: '#f1f5f9', borderRadius: '8px', textTransform: 'capitalize' }}>{profile.occupation?.replace('_', ' ') || 'Office'}</div></div>
                </div>

                <div>
                  <div style={{ fontWeight: 600, color: '#334155', marginBottom: '6px', fontSize: '0.82rem' }}>Conditions & Vulnerabilities</div>
                  <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                    {profile.conditions?.map((c, ci) => (
                      <span key={ci} style={{ padding: '4px 10px', background: '#ecfdf5', color: '#059669', borderRadius: '999px', fontWeight: 600, fontSize: '0.74rem', textTransform: 'capitalize' }}>
                        {c.replace('_', ' ')}
                      </span>
                    ))}
                  </div>
                </div>

                <div style={{ marginTop: '20px', display: 'flex', gap: '8px' }}>
                  <button onClick={handleSignOut} style={{ flex: 1, padding: '10px', background: '#fef2f2', color: '#dc2626', border: '1px solid #fecaca', borderRadius: '999px', textAlign: 'center', fontWeight: 600, fontSize: '0.82rem', cursor: 'pointer' }}>
                    Sign Out
                  </button>
                  <button onClick={() => setIsProfileModalOpen(false)} style={{ padding: '10px 22px', background: '#0f172a', color: '#ffffff', borderRadius: '999px', fontWeight: 600, fontSize: '0.82rem', border: 'none', cursor: 'pointer' }}>
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div style={{ position: 'fixed', bottom: '24px', right: '24px', background: '#0f172a', color: '#ffffff', padding: '10px 18px', borderRadius: '999px', boxShadow: 'var(--shadow-elevated)', fontSize: '0.82rem', fontWeight: 500, zIndex: 2000, display: 'flex', alignItems: 'center', gap: '8px', animation: 'toastIn 0.3s ease' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#10b981' }} />
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
